name: Release
on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-latest
          - target: windows-x64
            runner: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: cd packages/cli && bun install --frozen-lockfile
      - run: bun scripts/patch-opentui-reconciler.js
      - run: cd packages/cli && bun build --compile ./src/index.tsx --outfile dist/filiks
        if: matrix.target != 'windows-x64'
      - run: |
          curl.exe -fsSL https://github.com/oven-sh/bun/releases/download/bun-v1.3.14/bun-windows-x64-baseline.zip -o bun-baseline.zip
          tar -xf bun-baseline.zip
          $bun = Get-ChildItem -Recurse -Filter bun.exe | Select-Object -First 1 -ExpandProperty FullName
          & $bun build --compile packages/cli/src/index.tsx --outfile packages/cli/dist/filiks
        if: matrix.target == 'windows-x64'
      - run: cd packages/cli/dist && tar -czf filiks-${{ matrix.target }}.tar.gz --exclude='*.tar.gz' filiks*
      - uses: actions/upload-artifact@v4
        with:
          name: filiks-${{ matrix.target }}
          path: packages/cli/dist/filiks-${{ matrix.target }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: filiks-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: filiks-*.tar.gz
          generate_release_notes: true
